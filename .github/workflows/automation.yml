name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Run Video Generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"
        run: |
          if [ -f "automationOrchestrator.js" ]; then
            node automationOrchestrator.js
          elif [ -f "src/automationOrchestrator.js" ]; then
            node src/automationOrchestrator.js
          else
            echo "automationOrchestrator.js not found!"
            exit 1
          fi

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            *.mp4
            output/*.mp4
            renders/*.mp4
            public/*.mp4
          if-no-files-found: warn
