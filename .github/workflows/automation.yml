name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Check System
        run: |
          node --version
          npm --version
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Install Node.js Dependencies
        run: npm install

      - name: Prepare Output Directory
        run: |
          mkdir -p output_artifacts
          mkdir -p data

      - name: Run Orchestrator Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"
          OUTPUT_DIR: "output_artifacts"
        run: |
          echo "======================================"
          echo "STARTING ZEESHAN AI VIDEO GENERATOR"
          echo "======================================"

          node src/orchestrator.mjs "Never Give Up" --count=1

          echo "======================================"
          echo "ORCHESTRATOR FINISHED"
          echo "======================================"

      - name: Inspect Generated Files
        if: always()
        run: |
          echo "======================================"
          echo "GENERATED MP4 FILES"
          echo "======================================"

          find . \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -type f \
            -name "*.mp4" \
            -print

          echo ""
          echo "Output directory:"
          find output_artifacts \
            -type f \
            -print 2>/dev/null || true

      - name: Collect Generated Video Artifacts
        if: always()
        run: |
          mkdir -p output_artifacts

          find output_artifacts \
            -type f \
            -name "*.mp4" \
            -exec cp -f {} output_artifacts/ \;

          echo "======================================"
          echo "FINAL ARTIFACT DIRECTORY"
          echo "======================================"

          ls -lah output_artifacts

      - name: Verify Generated Video
        run: |
          echo "Checking for generated MP4..."

          MP4_COUNT=$(find output_artifacts \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo "MP4 count: $MP4_COUNT"

          if [ "$MP4_COUNT" -eq 0 ]; then
            echo "ERROR: No generated MP4 video was found."
            exit 1
          fi

          echo "Generated video found successfully."

      - name: Validate Generated Videos
        run: |
          for video in output_artifacts/*.mp4
          do
            echo "======================================"
            echo "Validating: $video"
            echo "======================================"

            test -f "$video"

            ffprobe \
              -v error \
              -show_entries format=duration \
              -show_entries stream=codec_name,width,height \
              -of default=noprint_wrappers=1 \
              "$video"

            echo "Video validation completed."
          done

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: output_artifacts/*.mp4
          if-no-files-found: error