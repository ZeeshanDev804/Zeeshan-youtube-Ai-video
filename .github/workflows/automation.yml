name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Check System
        run: |
          node --version
          npm --version
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Install Node.js Dependencies
        run: npm install

      - name: Prepare Output Directory
        run: |
          mkdir -p output
          mkdir -p output/final
          mkdir -p output/audio
          mkdir -p output/music
          mkdir -p data
          mkdir -p output_artifacts

      - name: Run Orchestrator Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"

          OUTPUT_DIR: "output"

        run: |
          echo "======================================"
          echo "STARTING ZEESHAN AI VIDEO GENERATOR"
          echo "======================================"

          node src/orchestrator.mjs "Never Give Up" --count=1

          echo "======================================"
          echo "ORCHESTRATOR FINISHED"
          echo "======================================"

      - name: Inspect Generated Files
        if: always()
        run: |
          echo "======================================"
          echo "ALL GENERATED MP4 FILES"
          echo "======================================"

          find output \
            -type f \
            -name "*.mp4" \
            -print \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "FINAL DIRECTORY"
          echo "======================================"

          find output/final \
            -type f \
            -print \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "AUDIO FILES"
          echo "======================================"

          find output/audio \
            -type f \
            -print \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "MUSIC FILES"
          echo "======================================"

          find output/music \
            -type f \
            -print \
            2>/dev/null || true

      - name: Collect Generated Video Artifacts
        if: always()
        run: |
          set -e

          echo "======================================"
          echo "COLLECTING FINAL GENERATED VIDEO"
          echo "======================================"

          mkdir -p output_artifacts

          rm -f output_artifacts/*.mp4

          FINAL_VIDEO=""

          echo ""
          echo "Searching ONLY in output/final..."

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              FINAL_VIDEO="$file"
              echo "Final video candidate: $file"
              break
            fi
          done < <(
            find output/final \
              -maxdepth 1 \
              -type f \
              -name "*.mp4" \
              -print \
              2>/dev/null
          )

          if [ -z "$FINAL_VIDEO" ]; then
            echo ""
            echo "======================================"
            echo "ERROR: FINAL MP4 NOT FOUND"
            echo "======================================"

            echo ""
            echo "All MP4 files found:"
            find output \
              -type f \
              -name "*.mp4" \
              -print \
              2>/dev/null || true

            echo ""
            echo "Final directory contents:"
            ls -lah output/final 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FINAL VIDEO FOUND"
          echo "======================================"

          echo "Source:"
          echo "$FINAL_VIDEO"

          cp -f "$FINAL_VIDEO" output_artifacts/final_video.mp4

          echo ""
          echo "Copied final video to:"
          echo "output_artifacts/final_video.mp4"

          echo ""
          echo "======================================"
          echo "FINAL ARTIFACT DIRECTORY"
          echo "======================================"

          ls -lah output_artifacts

      - name: Verify Generated Video
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING GENERATED VIDEO"
          echo "======================================"

          MP4_COUNT=$(find output_artifacts \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo "MP4 count: $MP4_COUNT"

          if [ "$MP4_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 final MP4."
            exit 1
          fi

          test -f output_artifacts/final_video.mp4

          echo "Final MP4 found successfully."

      - name: Validate Generated Video
        run: |
          set -e

          VIDEO="output_artifacts/final_video.mp4"

          echo "======================================"
          echo "VALIDATING FINAL VIDEO"
          echo "======================================"

          test -f "$VIDEO"

          echo ""
          echo "FFPROBE INFORMATION:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=index,codec_type,codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            "$VIDEO"

          echo ""
          echo "Checking video stream..."

          VIDEO_STREAM=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 \
            "$VIDEO")

          if [ "$VIDEO_STREAM" != "video" ]; then
            echo "ERROR: No valid video stream found."
            exit 1
          fi

          echo "Video stream: OK"

          echo ""
          echo "Checking audio stream..."

          AUDIO_STREAM=$(ffprobe \
            -v error \
            -select_streams a:0 \
            -show_entries stream=codec_type \
            -of csv=p=0 \
            "$VIDEO" || true)

          if [ "$AUDIO_STREAM" != "audio" ]; then
            echo "ERROR: No valid audio stream found."
            exit 1
          fi

          echo "Audio stream: OK"

          echo ""
          echo "Checking resolution..."

          WIDTH=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=width \
            -of csv=p=0 \
            "$VIDEO")

          HEIGHT=$(ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=height \
            -of csv=p=0 \
            "$VIDEO")

          echo "Resolution: ${WIDTH}x${HEIGHT}"

          if [ "$WIDTH" -ne 1080 ] || [ "$HEIGHT" -ne 1920 ]; then
            echo "ERROR: Expected 1080x1920 video."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FINAL VIDEO VALIDATION PASSED"
          echo "======================================"

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: output_artifacts/final_video.mp4
          if-no-files-found: error