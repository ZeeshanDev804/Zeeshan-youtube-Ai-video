name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Create Isolated Output Directory
        run: |
          mkdir -p output_media
          mkdir -p /tmp/shorts_output

      - name: Run Video Generator with Trends
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"
          OUTPUT_DIR: "output_media"
        run: |
          echo "=== Starting USA/UK/EU High-Security Video Engine ==="
          
          # Directly target automationOrchestrator.js specifically
          if [ -f "automationOrchestrator.js" ]; then
            node automationOrchestrator.js
          elif [ -f "src/automationOrchestrator.js" ]; then
            node src/automationOrchestrator.js
          else
            TARGET_FILE=$(find . -not -path '*/node_modules/*' -name "automationOrchestrator.js" | head -n 1)
            if [ -n "$TARGET_FILE" ]; then
              node "$TARGET_FILE"
            else
              echo "CRITICAL ERROR: automationOrchestrator.js file not found in repo!"
              exit 1
            fi
          fi

      - name: Secure and Collect Generated Video
        if: always()
        run: |
          echo "=== Collecting generated videos from all locations ==="
          mkdir -p final_video_download
          
          # Find all mp4 files excluding node_modules and copy them
          find . -not -path '*/node_modules/*' -name "*.mp4" -exec cp {} final_video_download/ \;
          
          echo "=== Contents of final_video_download folder ==="
          ls -la final_video_download/

      - name: Upload Generated Short Video
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: final_video_download/
          if-no-files-found: warn
