name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Check System
        run: |
          node --version
          npm --version
          ffmpeg -version
          ffprobe -version
          espeak-ng --version

      - name: Install Node.js Dependencies
        run: npm install

      - name: Prepare Output Directory
        run: |
          mkdir -p output_artifacts
          mkdir -p data

      - name: Run Orchestrator Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"
          OUTPUT_DIR: "output_artifacts"
        run: |
          echo "======================================"
          echo "STARTING ZEESHAN AI VIDEO GENERATOR"
          echo "======================================"

          node src/orchestrator.mjs "Never Give Up" --count=1

          echo "======================================"
          echo "ORCHESTRATOR FINISHED"
          echo "======================================"

      - name: Inspect Generated Files
        if: always()
        run: |
          echo "======================================"
          echo "ALL GENERATED MP4 FILES"
          echo "======================================"

          find . \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -type f \
            -name "*.mp4" \
            -print \
            2>/dev/null || true

          echo ""
          echo "======================================"
          echo "OUTPUT DIRECTORIES"
          echo "======================================"

          echo "--- output_artifacts ---"
          find output_artifacts \
            -type f \
            -print \
            2>/dev/null || true

          echo ""
          echo "--- output ---"
          find output \
            -type f \
            -print \
            2>/dev/null || true

          echo ""
          echo "--- final ---"
          find final \
            -type f \
            -print \
            2>/dev/null || true

      - name: Collect Generated Video Artifacts
        if: always()
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR FINAL GENERATED VIDEO"
          echo "======================================"

          mkdir -p output_artifacts

          FINAL_VIDEO=""

          echo ""
          echo "--- Checking output_artifacts ---"

          while IFS= read -r file; do
            if [ -n "$file" ]; then
              filename=$(basename "$file")

              case "$filename" in
                scene-*.mp4|scene_*.mp4|normalized-*.mp4|normalized_*.mp4|combined-video.mp4|video_only_temp.mp4)
                  echo "Skipping intermediate: $file"
                  ;;
                *)
                  FINAL_VIDEO="$file"
                  echo "Candidate final video: $file"
                  ;;
              esac
            fi
          done < <(
            find output_artifacts \
              -type f \
              -name "*.mp4" \
              -print \
              2>/dev/null
          )

          if [ -z "$FINAL_VIDEO" ]; then
            echo ""
            echo "--- Checking output ---"

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                filename=$(basename "$file")

                case "$filename" in
                  scene-*.mp4|scene_*.mp4|normalized-*.mp4|normalized_*.mp4|combined-video.mp4|video_only_temp.mp4)
                    echo "Skipping intermediate: $file"
                    ;;
                  *)
                    FINAL_VIDEO="$file"
                    echo "Candidate final video: $file"
                    ;;
                esac
              fi
            done < <(
              find output \
                -type f \
                -name "*.mp4" \
                -print \
                2>/dev/null
            )
          fi

          if [ -z "$FINAL_VIDEO" ]; then
            echo ""
            echo "--- Checking final ---"

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                filename=$(basename "$file")

                case "$filename" in
                  scene-*.mp4|scene_*.mp4|normalized-*.mp4|normalized_*.mp4|combined-video.mp4|video_only_temp.mp4)
                    echo "Skipping intermediate: $file"
                    ;;
                  *)
                    FINAL_VIDEO="$file"
                    echo "Candidate final video: $file"
                    ;;
                esac
              fi
            done < <(
              find final \
                -type f \
                -name "*.mp4" \
                -print \
                2>/dev/null
            )
          fi

          if [ -z "$FINAL_VIDEO" ]; then
            echo ""
            echo "--- Global final-video search ---"

            while IFS= read -r file; do
              if [ -n "$file" ]; then
                filename=$(basename "$file")

                case "$filename" in
                  scene-*.mp4|scene_*.mp4|normalized-*.mp4|normalized_*.mp4|combined-video.mp4|video_only_temp.mp4)
                    echo "Skipping intermediate: $file"
                    ;;
                  *)
                    FINAL_VIDEO="$file"
                    echo "Candidate final video: $file"
                    ;;
                esac
              fi
            done < <(
              find . \
                -not -path './node_modules/*' \
                -not -path './.git/*' \
                -type f \
                -name "*.mp4" \
                -print \
                2>/dev/null
            )
          fi

          if [ -n "$FINAL_VIDEO" ]; then
            echo ""
            echo "======================================"
            echo "FINAL VIDEO FOUND"
            echo "======================================"
            echo "Source: $FINAL_VIDEO"

            cp -f "$FINAL_VIDEO" output_artifacts/final_video.mp4

            echo ""
            echo "Copied to:"
            echo "output_artifacts/final_video.mp4"
          else
            echo ""
            echo "======================================"
            echo "ERROR: NO FINAL MP4 FOUND"
            echo "======================================"

            echo ""
            echo "Repository files:"
            find . \
              -not -path './node_modules/*' \
              -not -path './.git/*' \
              -type f \
              -print \
              2>/dev/null | head -n 300

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FINAL ARTIFACT DIRECTORY"
          echo "======================================"

          ls -lah output_artifacts

          echo ""
          echo "MP4 count:"
          find output_artifacts \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l

      - name: Verify Generated Video
        run: |
          echo "Checking for generated MP4..."

          MP4_COUNT=$(find output_artifacts \
            -maxdepth 1 \
            -type f \
            -name "*.mp4" \
            | wc -l)

          echo "MP4 count: $MP4_COUNT"

          if [ "$MP4_COUNT" -eq 0 ]; then
            echo "ERROR: No generated MP4 video was found."
            exit 1
          fi

          echo "Generated video found successfully."

      - name: Validate Generated Videos
        run: |
          for video in output_artifacts/*.mp4
          do
            echo "======================================"
            echo "Validating: $video"
            echo "======================================"

            test -f "$video"

            ffprobe \
              -v error \
              -show_entries format=duration \
              -show_entries stream=codec_name,width,height \
              -of default=noprint_wrappers=1 \
              "$video"

            echo "Video validation completed."
          done

      - name: Upload Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: output_artifacts/*.mp4
          if-no-files-found: error