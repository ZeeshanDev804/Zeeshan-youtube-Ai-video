      - name: Collect Generated Video Artifacts
        if: always()
        run: |
          mkdir -p output_artifacts
          find . -not -path '*/node_modules/*' -name "*.mp4" -exec cp {} output_artifacts/ \;

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: output_artifacts/
