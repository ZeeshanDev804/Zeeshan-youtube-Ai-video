name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Run Video Generator with Trends
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"
        run: |
          echo "=== Running Direct Target Script ==="
          if [ -f "automationOrchestrator.js" ]; then
            node automationOrchestrator.js
          elif [ -f "src/automationOrchestrator.js" ]; then
            node src/automationOrchestrator.js
          else
            echo "Direct search for automationOrchestrator.js..."
            FILE_PATH=$(find . -not -path '*/node_modules/*' -name "automationOrchestrator.js" | head -n 1)
            if [ -n "$FILE_PATH" ]; then
              node "$FILE_PATH"
            else
              echo "CRITICAL: automationOrchestrator.js file not found!"
              exit 1
            fi
          fi

      - name: Locate and Collect All Generated Media
        if: always()
        run: |
          echo "=== Scanning for generated MP4 files ==="
          mkdir -p output_artifacts
          find . -not -path '*/node_modules/*' -name "*.mp4" -exec cp {} output_artifacts/ \;
          echo "Files copied to output_artifacts:"
          ls -la output_artifacts/

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: output_artifacts/
          if-no-files-found: warn
