name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install System Dependencies (FFmpeg & eSpeak Engine)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Node.js Dependencies
        run: npm install

      - name: Run Orchestrator Script
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_REGION: "US,GB,EU"
          ENABLE_GOOGLE_TRENDS: "true"
          ENABLE_YOUTUBE_TRENDS: "true"
        run: node src/orchestrator.mjs

      - name: Collect Generated Video Artifacts
        if: always()
        run: |
          mkdir -p output_artifacts
          find . -not -path '*/node_modules/*' -name "*.mp4" -exec cp {} output_artifacts/ \;

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-youtube-short
          path: output_artifacts/
