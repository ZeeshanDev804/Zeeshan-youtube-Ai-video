name: Automated Shorts Generator Pipeline

on:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: npm install

      - name: Run Video Generator
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Finding entry file..."
          TARGET_FILE=$(find . -maxdepth 3 -not -path '*/node_modules/*' -name "automationOrchestrator.js" -o -name "index.js" -o -name "app.js" -o -name "main.js" | head -n 1)
          
          if [ -n "$TARGET_FILE" ]; then
            echo "Running file: $TARGET_FILE"
            node "$TARGET_FILE"
          else
            echo "Searching all js files..."
            ANY_JS=$(find . -maxdepth 2 -not -path '*/node_modules/*' -name "*.js" | head -n 1)
            if [ -n "$ANY_JS" ]; then
              echo "Running alternative file: $ANY_JS"
              node "$ANY_JS"
            else
              echo "No JavaScript file found!"
              exit 1
            fi
          fi

      - name: Upload Generated Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-short-video
          path: |
            *.mp4
            output/*.mp4
          if-no-files-found: warn
